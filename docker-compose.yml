services:
  postgres:
    image: postgres:16
    container_name: aligne-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aligne
    ports:
      - "5433:5432"
    volumes:
      - aligne-data:/var/lib/postgresql/data

volumes:
  aligne-data: